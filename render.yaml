services:
  - type: web
    name: clubsy-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: pnpm install --frozen-lockfile && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clubsy-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: clubsy-db
    region: frankfurt
    plan: basic-256mb
